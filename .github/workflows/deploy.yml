name: Deploy CRM Frontend

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    # This ensures the job runs on your specific self-hosted runner
    runs-on: self-hosted

    steps:
      - name: Force Update Code
        run: |
          # 1. Navigate to the project directory on the server
          # Verified Path from your screenshot
          cd /home/abhishek/buzzhire_crm/CRM

          # 2. Fetch the latest metadata from GitHub
          git fetch --all

          # 3. Hard Reset: Discard local changes to match the remote branch exactly
          git reset --hard origin/main

          # 4. Pull the latest code from the main branch
          git pull origin main

      - name: Install Dependencies, Build, and Restart
        run: |
          # 1. Navigate to the project directory
          cd /home/abhishek/buzzhire_crm/CRM

          # 2. Install any new Node.js dependencies
          npm install

          # 3. Create a production build of the Next.js application
          npm run build

          # 4. Restart the specific PM2 process for this application
          # This ensures the app reloads with the new code on Port 3001
          pm2 restart candidates-frontend
